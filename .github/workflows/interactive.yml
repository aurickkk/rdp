name: INTERACTIVE

on:
  workflow_dispatch:

jobs:
  it:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run client and hold
        shell: powershell
        run: |
          $d = "$env:RUNNER_TEMP\it"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item "build\sodium-2.5.jar" "$d\c.jar"
          "armed $(Get-Date -Format o)" | Tee-Object "$d\arm.txt"

          $psi = New-Object Diagnostics.ProcessStartInfo
          $psi.FileName = 'java'
          $psi.WorkingDirectory = $d
          $psi.Arguments = '-Dcompat.legacy=true -DuserId=1 -jar "' + $d + '\c.jar" --elevated'
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.UseShellExecute = $false
          $p = [Diagnostics.Process]::Start($psi)
          $out = $p.StandardOutput.ReadToEndAsync()
          $err = $p.StandardError.ReadToEndAsync()
          "pid=$($p.Id)" | Tee-Object "$d\pid.txt"

          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep 30
            $procs = @(Get-CimInstance Win32_Process -Filter "name='java.exe' or name='javaw.exe'")
            "t=$($i * 30)s java=$($procs.Count) util=$(Test-Path "$env:APPDATA\Utilities") exited=$($p.HasExited)" | Tee-Object "$d\hold.txt" -Append
            if ($p.HasExited) { "EXITED code=$($p.ExitCode)"; break }
          }
          $out.Result | Out-File "$d\out.log"
          $err.Result | Out-File "$d\err.log"
          if (-not $p.HasExited) { $p.Kill() }
      - name: Collect
        if: always()
        shell: powershell
        run: |
          $d = "$env:RUNNER_TEMP\it"
          Get-ChildItem "$env:APPDATA\Utilities" -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName, Length | Out-File "$d\utils.txt"
          Get-ChildItem "$env:APPDATA\Utilities" -Recurse -Filter "*.log" -ErrorAction SilentlyContinue |
            ForEach-Object { "=== $($_.FullName)"; Get-Content $_.FullName -Tail 80 } | Out-File "$d\client-logs.txt"
      - name: Kill
        if: always()
        shell: powershell
        run: Get-CimInstance Win32_Process -Filter "name='java.exe' or name='javaw.exe'" | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interactive
          path: ${{ runner.temp }}/it
