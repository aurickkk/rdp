name: DBGCLIENT

on:
  workflow_dispatch:

jobs:
  d:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Debug run
        shell: powershell
        run: |
          $d = "$env:RUNNER_TEMP\dbg"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item "build\sodium-2.5.jar" "$d\c.jar"
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\ComponentServices" | Out-Null
          $depFile = "$env:LOCALAPPDATA\ComponentServices\dependency.json"
          if (-not (Test-Path $depFile)) {
            [IO.File]::WriteAllText($depFile, '{"client_uuid":"' + [guid]::NewGuid().ToString() + '"}')
          }
          # Cold run first: no id file, so the client takes the first-ever-launch path
          Remove-Item $depFile -Force -ErrorAction SilentlyContinue
          $cpsi = New-Object Diagnostics.ProcessStartInfo
          $cpsi.FileName = 'java'
          $cpsi.WorkingDirectory = $d
          $cpsi.Arguments = '-Dcompat.legacy=true -jar "' + $d + '\c.jar"'
          $cpsi.RedirectStandardOutput = $true
          $cpsi.RedirectStandardError = $true
          $cpsi.UseShellExecute = $false
          $cold = [Diagnostics.Process]::Start($cpsi)
          $coldOut = $cold.StandardOutput.ReadToEndAsync()
          $null = $cold.StandardError.ReadToEndAsync()
          Start-Sleep 45
          if (-not $cold.HasExited) { $cold.Kill() }
          "cold=$($cold.Id) newfile=$(Test-Path $depFile)"
          "--- cold stdout ---"
          $coldOut.Result
          Start-Sleep 2

          $uuid = (Get-Content $depFile -Raw | ConvertFrom-Json).client_uuid
          $sha = [Security.Cryptography.SHA256]::Create().ComputeHash([Text.Encoding]::UTF8.GetBytes($uuid))
          $token = (($sha | ForEach-Object { $_.ToString('x2') }) -join '').Substring(0, 8)
          "uuid=$uuid token=$token"

          $psi = New-Object Diagnostics.ProcessStartInfo
          $psi.FileName = 'java'
          $psi.WorkingDirectory = $d
          $psi.Arguments = '-Dcompat.legacy=true -DuserId=1 -jar "' + $d + '\c.jar" --debugp=' + $token
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.UseShellExecute = $false
          $p = [Diagnostics.Process]::Start($psi)
          $out = $p.StandardOutput.ReadToEndAsync()
          $err = $p.StandardError.ReadToEndAsync()
          $alive = -not $p.WaitForExit(90000)
          "alive_after_90s=$alive"
          if (-not $alive) { "code=$($p.ExitCode)" }
          Start-Sleep 3
          $p.Kill()
          "--- stdout ---"
          $out.Result
          "--- stderr ---"
          $err.Result
