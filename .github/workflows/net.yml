name: NetCheck
on:
  workflow_dispatch:
jobs:
  n:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run
        shell: powershell
        run: |
          javac NC.java
          java NC