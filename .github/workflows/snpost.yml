name: SNPOST
on:
  workflow_dispatch:
    inputs:
      path:
        description: "path under /shard/"
        required: true
        default: "submitData"
      body:
        description: "JSON body"
        required: false
        default: "{}"
      hdr:
        description: "extra header lines (semicolon separated name:value)"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Post
        shell: bash
        env:
          BODY: ${{ inputs.body }}
          PATH_: ${{ inputs.path }}
          HDR: ${{ inputs.hdr }}
        run: |
          args=()
          IFS=';' read -ra H <<< "$HDR"
          for h in "${H[@]}"; do [ -n "$h" ] && args+=(-H "$h"); done
          code=$(curl -s -o /tmp/out -w "%{http_code}" --max-time 25 \
            -X POST -H "Content-Type: application/json" \
            -H "X-Edge-Cache-Revalidate: revalidate" -H "X-Runtime-Env: jre-embedded" \
            "${args[@]}" --data-binary "$BODY" "https://thisisafalsepositive.st/shard/$PATH_")
          echo "code=$code"
          echo "len=$(wc -c < /tmp/out)"
          head -c 600 /tmp/out
