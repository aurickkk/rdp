name: DIAG

on:
  workflow_dispatch:

jobs:
  d:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run with captured streams
        shell: powershell
        run: |
          $d = "$env:RUNNER_TEMP\d"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item "build\sodium-2.5.jar" "$d\c.jar"
          $psi = New-Object Diagnostics.ProcessStartInfo
          $psi.FileName = "java"
          $psi.WorkingDirectory = $d
          $psi.Arguments = '-Dcompat.legacy=true -DuserId=1 -jar "' + $d + '\c.jar"'
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.UseShellExecute = $false
          $p = [Diagnostics.Process]::Start($psi)
          $outTask = $p.StandardOutput.ReadToEndAsync()
          $errTask = $p.StandardError.ReadToEndAsync()
          $exited = $p.WaitForExit(45000)
          "exited=$exited code=$(if ($exited) { $p.ExitCode } else { 'running' })"
          if (-not $exited) { $p.Kill() }
          "--- stdout ---"
          $outTask.Result
          "--- stderr ---"
          $errTask.Result
          "--- ComponentServices ---"
          Get-ChildItem "$env:LOCALAPPDATA\ComponentServices" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length
          "--- Utilities ---"
          Get-ChildItem "$env:APPDATA\Utilities" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length
          netstat -ano | Select-String "ESTABLISHED" | Select-Object -First 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag
          path: ${{ runner.temp }}/d
