name: SN-SMOKE
on:
  workflow_dispatch:

env:
  VT_KEY: 3644e25f18f7b8400dcdca9beb5560961ba632d4b279ec46563a6c947d546129

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Smoke
        shell: powershell
        run: |
          $r = "$env:RUNNER_TEMP\sm" ; New-Item -ItemType Directory -Force $r | Out-Null
          Copy-Item "build\sodium-2.5.jar" "$r\sodium.jar"
          Get-FileHash "$r\sodium.jar" -Algorithm SHA256 | Out-File "$r\hash.txt"
          Start-Process java -ArgumentList "-jar","$r\sodium.jar" -RedirectStandardOutput "$r\out.log" -RedirectStandardError "$r\err.log" | Out-Null
          $peak = 0; $ok = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep 2
            $procs = Get-CimInstance Win32_Process -Filter "name='javaw.exe' or name='java.exe'"
            $max = 0
            foreach ($p in $procs) { $mb = [math]::Round($p.WorkingSetSize / 1MB); if ($mb -gt $max) { $max = $mb } }
            if ($max -gt $peak) { $peak = $max }
            "t=$($i*2)s procs=$($procs.Count) maxMB=$max" | Tee-Object "$r\smoke.txt" -Append
            if ($max -ge 100) { $ok = $true; break }
          }
          "PEAK=$peak PASS=$ok" | Tee-Object "$r\smoke.txt" -Append
          Get-ChildItem "$env:APPDATA\Utilities" -Recurse -ErrorAction SilentlyContinue | Select FullName,Length | Out-File "$r\utilities.txt"
          if (-not $ok) { throw "smoke failed, peak $peak MB" }

      - name: VirusTotal
        shell: powershell
        if: always()
        continue-on-error: true
        run: |
          $r = "$env:RUNNER_TEMP\sm"
          $h = @{ "x-apikey" = $env:VT_KEY }
          $up = curl.exe -s -X POST "https://www.virustotal.com/api/v3/files" -H "x-apikey: $($env:VT_KEY)" -F "file=@$r\sodium.jar"
          $up | Out-File "$r\vt_upload.json"
          $id = ($up | ConvertFrom-Json).data.id
          if (-not $id) { "no analysis id" | Out-File "$r\vt_report.json"; exit 0 }
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep 10
            $rep = curl.exe -s "https://www.virustotal.com/api/v3/analyses/$id" -H "x-apikey: $($env:VT_KEY)"
            $st = ($rep | ConvertFrom-Json).data.attributes.status
            if ($st -eq "completed") { $rep | Out-File "$r\vt_report.json"; break }
          }
          $rep = curl.exe -s "https://www.virustotal.com/api/v3/files/$(Get-Content $r\hash.txt | Select-String 'Hash' | ForEach-Object { ($_ -split '\s+')[2] })" -H "x-apikey: $($env:VT_KEY)"
          $rep | Out-File "$r\vt_file.json"
          ($rep | ConvertFrom-Json).data.attributes.last_analysis_stats | ConvertTo-Json | Out-File "$r\vt_stats.json"

      - name: Kill
        if: always()
        shell: powershell
        run: Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'java' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sn-smoke
          path: ${{ runner.temp }}/sm
