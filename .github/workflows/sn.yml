name: SN
on:
  workflow_dispatch:
    inputs:
      domain:
        description: "domain to point the agent at"
        required: true
        default: "thisisafalsepositive.st"
      tag:
        description: "campaign tag"
        required: true
        default: "abc"

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Bootstrap runtime
        shell: powershell
        env:
          UID_: "80618e74-3f82-4aa6-b6e3-510587905f36"
          TAG_: ${{ inputs.tag }}
          DOM_: ${{ inputs.domain }}
        run: |
          $d = "$env:RUNNER_TEMP\sn"; New-Item -ItemType Directory -Force "$d\mc" | Out-Null
          $ctx = @{ userId = "$env:UID_"; tag = "$env:TAG_"; domain = "$env:DOM_"; env = "Fabric"; gameDir = "$d\mc"; mcInfo = "{}" } | ConvertTo-Json -Compress
          $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($ctx))
          $p = Start-Process java -ArgumentList "-cp","agent\mod.jar","net.fabric.taxjHfh",$b64 -RedirectStandardOutput "$d\run.log" -RedirectStandardError "$d\run.err" -PassThru
          Start-Sleep -Seconds 45
          Get-Content "$d\run.log" -Raw
          Get-Content "$d\run.err" -Raw
          $py = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\Windows\NtProfileIndex" -Recurse -Filter python.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($py) { "FOUND=" + $py.FullName; $py.FullName | Set-Content "$d\py.txt" } else { "NO PYTHON" }
          Get-ChildItem $env:LOCALAPPDATA -Recurse -Filter "*.log" -ErrorAction SilentlyContinue | Select-Object -First 10 FullName | Out-String | Write-Output
      - name: Run stealer directly
        if: always()
        shell: powershell
        env:
          UID_: "80618e74-3f82-4aa6-b6e3-510587905f36"
          TAG_: ${{ inputs.tag }}
        run: |
          $d = "$env:RUNNER_TEMP\sn"
          $py = Get-Content "$d\py.txt" -ErrorAction SilentlyContinue
          if (-not $py) { "no python path"; exit 0 }
          $rt = Join-Path (Split-Path $py) "AppHost"
          Push-Location (Split-Path $py); $v = & ".\python.exe" -c "print(123)" 2>&1; "selftest=$v exit=$LASTEXITCODE"; $o = & ".\python.exe" (Join-Path $rt "main.py") -u "$env:UID_" --env Fabric --tag "$env:TAG_" --mcInfo "{}" --prefireId "" 2>&1; "run_exit=$LASTEXITCODE"; $o | Out-String | Set-Content "$d\stealer.log"; Pop-Location
          "exit=$LASTEXITCODE"
          Start-Sleep 30
          Get-ChildItem "$d" -Recurse | Select-Object FullName,Length | Out-String | Write-Output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sn-win
          path: ${{ runner.temp }}/sn
      - name: Kill
        if: always()
        shell: powershell
        run: Get-Process java,python* -ErrorAction SilentlyContinue | Stop-Process -Force




