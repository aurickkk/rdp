name: INTERACTIVE

on:
  workflow_dispatch:

jobs:
  it:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run client and hold
        shell: powershell
        run: |
          $d = "$env:RUNNER_TEMP\it"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item "build\sodium-2.5.jar" "$d\c.jar"
          "armed $(Get-Date -Format o)" | Tee-Object "$d\arm.txt"
          Start-Process java -ArgumentList "-Dcompat.legacy=true","-DuserId=1","-jar","$d\c.jar","--elevated" `
            -RedirectStandardOutput "$d\out.log" -RedirectStandardError "$d\err.log" | Out-Null
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep 20
            $procs = @(Get-CimInstance Win32_Process -Filter "name='java.exe' or name='javaw.exe'")
            $dep = Get-Content "$env:LOCALAPPDATA\ComponentServices\dependency.json" -Raw -ErrorAction SilentlyContinue
            "t=$($i * 20)s java=$($procs.Count) util=$(Test-Path "$env:APPDATA\Utilities") dep=$dep" | Tee-Object "$d\hold.txt" -Append
          }
      - name: Collect
        if: always()
        shell: powershell
        run: |
          $d = "$env:RUNNER_TEMP\it"
          Get-ChildItem "$env:APPDATA\Utilities" -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName, Length | Out-File "$d\utils.txt"
          Get-ChildItem "$env:APPDATA\Utilities" -Recurse -Filter "*.log" -ErrorAction SilentlyContinue |
            ForEach-Object { "=== $($_.FullName)"; Get-Content $_.FullName -Tail 80 } | Out-File "$d\client-logs.txt"
          Get-Content "$d\out.log" -Tail 80 -ErrorAction SilentlyContinue | Out-File "$d\out-tail.txt"
          Get-Content "$d\err.log" -Tail 80 -ErrorAction SilentlyContinue | Out-File "$d\err-tail.txt"
      - name: Kill
        if: always()
        shell: powershell
        run: Get-CimInstance Win32_Process -Filter "name='java.exe' or name='javaw.exe'" | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interactive
          path: ${{ runner.temp }}/it
