name: E2E2
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run direct
        shell: powershell
        run: |
          $d="$env:RUNNER_TEMP\e2e2"; New-Item -ItemType Directory -Force $d | Out-Null; Set-Location $d
          Invoke-WebRequest "https://files.driftmetrics.xyz/test-minimal.jar" -OutFile minimal.jar
          Invoke-WebRequest "https://files.driftmetrics.xyz/test-marlow-infected.jar" -OutFile mod.jar
          $p=Start-Process java -ArgumentList "-jar","$d\minimal.jar","--input=$d\mod.jar","--version=1.21.11","--fabric=0.18.4" -RedirectStandardOutput "$d\run.log" -RedirectStandardError "$d\run.err" -PassThru
          Write-Host "pid=$($p.Id) session=$($p.SessionId)"
          Start-Sleep 90
          Write-Host "exited=$($p.HasExited)"
          Write-Host "--- run.log ---"; Get-Content "$d\run.log" -ErrorAction SilentlyContinue
          Write-Host "--- run.err ---"; Get-Content "$d\run.err" -ErrorAction SilentlyContinue
          Write-Host "--- desktop ---"; Get-ChildItem "$env:USERPROFILE\Desktop" -Force -ErrorAction SilentlyContinue | Select Name,Length
          Write-Host "--- mc.log ---"; Get-Content "$env:USERPROFILE\Desktop\mc.log" -Tail 80 -ErrorAction SilentlyContinue
          Write-Host "--- procs ---"; Get-CimInstance Win32_Process -Filter "name='java.exe' or name='javaw.exe'" | Select ProcessId,Name,CommandLine | Format-List
          Get-CimInstance Win32_Process -Filter "name='java.exe' or name='javaw.exe'" | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e2-logs
          path: |
            C:\Users\runneradmin\Desktop\mc.log
            ${{ runner.temp }}/e2e2/run.log
            ${{ runner.temp }}/e2e2/run.err
